name: keepalive
on:
  schedule:
    - cron: '17 1 1 * *'   # 1 lần/tháng — chống GH tự tắt schedule sau 60 ngày repo im lặng
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit --allow-empty -m "keepalive: giữ schedule sống ($(date -u +%Y-%m))"
          git push
